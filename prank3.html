<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Message</title>

<style>
body{
    margin:0;
    height:100vh;
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
}

.box{
    background:white;
    width:80%;
    max-width:350px;
    padding:30px 20px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
}

button{
    background:#111;
    color:white;
    border:0;
    padding:14px 35px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

#message{
    display:none;
    font-size:22px;
    line-height:1.5;
}

.name{
    margin-top:25px;
    font-size:13px;
    color:#888;
}
</style>
</head>

<body>

<div class="box">

    <div id="start">
        <button onclick="showMessage()">💬 Message</button>
    </div>

    <div id="message">
        Kemon achen? 🙂<br><br>
        Accha, apne to amina ,<br>
        tai na? 🙂
        
        <div class="name">
            Ara Fa T
        </div>
    </div>

</div>

<script>
function showMessage(){
    document.getElementById("start").style.display="none";
    document.getElementById("message").style.display="block";
}
</script>

</body>
</html>
