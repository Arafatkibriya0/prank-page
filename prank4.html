<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  width: 85%;
  max-width: 360px;
  background: #0d0d0d;
  border: 1px solid #222;
  border-radius: 18px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 0 25px rgba(0,0,0,0.9);
}

button {
  background: #111;
  color: #eee;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 14px 30px;
  font-size: 18px;
}

button:active {
  background: #111;
  color: #eee;
}

#message {
  display: none;
  margin-top: 20px;
  color: #eee;
  font-size: 21px;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="box" id="page">

  <button onclick="showMessage()">💬 Message</button>

  <div id="message">
    Kemon achen A.E.A 🙂
  </div>

</div>

<script>
function showMessage() {

  document.getElementById("message").style.display = "block";

  setTimeout(function() {
    document.body.innerHTML = "";
    document.body.style.background = "#000";
  }, 5000);

}
</script>

</body>
</html>
