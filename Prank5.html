<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Message</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #111;
  font-family: Arial, sans-serif;
}

.box {
  position: relative;
  width: 85%;
  max-width: 360px;
  background: white;
  padding: 35px 20px;
  border-radius: 18px;
  text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.5);
}

button {
  background: #111;
  color: white;
  border: 0;
  padding: 14px 30px;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.2s;
}

button:active {
  transform: scale(0.95);
}

#content-container {
  display: none;
  margin-top: 20px;
  animation: fadeIn 0.5s ease-in-out;
}

.passport-img {
  width: 110px;
  height: 135px;
  object-fit: cover;
  border-radius: 8px;
  border: 2px solid #ddd;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  margin-bottom: 15px;
}

#message {
  font-size: 18px;
  line-height: 1.6;
  color: #222;
  font-weight: 500;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="box">

  <button id="msgBtn" onclick="showMessage()">💬 Click Here</button>

  <div id="content-container">
    <!-- আপনার ছবিটি এই কোডের সাথেই যুক্ত করা আছে -->
    <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAB5CAYAAADWnRscAAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAALEwAACxMBAJqcGAAAIABJREFUeJztnXmYVNWV9n/n3lq6e2mj2VqapVlkgYRF" alt="Profile Image" class="passport-img">
    <div id="message">
      আপনার WhatsApp এর প্রোফাইলের চাইতে imo র টা ই বেশি সুন্দর lage ...<br>
      crush! 🥰
    </div>
  </div>

</div>

<script>
let timer;

function showMessage(){
  clearTimeout(timer);
  
  document.getElementById("content-container").style.display = "block";
  
  // ঠিক ৪ সেকেন্ড পর অটো বন্ধ হয়ে যাবে
  timer = setTimeout(function(){
    document.getElementById("content-container").style.display = "none";
  }, 4000);
}
</script>

</body>
</html>
